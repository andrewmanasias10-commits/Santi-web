  </defs>
  <rect width="800" height="600" fill="url(#bgN)"/>
  <g fill="#FF82AE" opacity="0.25">
    <circle cx="90" cy="90" r="10"/>
    <circle cx="700" cy="120" r="14"/>
    <circle cx="640" cy="70" r="7"/>
