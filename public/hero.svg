<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustración SANTI">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CCFFF"/>
      <stop offset="0.52" stop-color="#FF9BBE"/>
      <stop offset="1" stop-color="#FFB13B"/>
    </linearGradient>
    <radialGradient id="scrim" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#000000" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB13B"/>
      <stop offset="1" stop-color="#F59700"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="760" fill="url(#sky)"/>

  <!-- Sol -->
  <g opacity="0.9">
    <circle cx="1350" cy="140" r="62" fill="#FFD874"/>
    <g stroke="#FFD874" stroke-width="9" stroke-linecap="round" opacity="0.8">
      <line x1="1350" y1="40" x2="1350" y2="14"/>
      <line x1="1445" y1="80" x2="1466" y2="64"/>
      <line x1="1255" y1="80" x2="1234" y2="64"/>
      <line x1="1460" y1="150" x2="1487" y2="150"/>
    </g>
  </g>

  <!-- Nubes -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="250" cy="150" rx="70" ry="30"/>
      <ellipse cx="300" cy="140" rx="52" ry="34"/>
      <ellipse cx="205" cy="140" rx="44" ry="26"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="1080" cy="110" rx="60" ry="26"/>
      <ellipse cx="1120" cy="102" rx="44" ry="28"/>
    </g>
  </g>

  <!-- Estrellas y puntos flotantes -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="620" cy="120" r="6"/>
    <circle cx="880" cy="90" r="8"/>
    <circle cx="470" cy="250" r="5"/>
    <circle cx="1230" cy="300" r="7"/>
    <path d="M760 170l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z" fill="#ffffff" opacity="0.9"/>
    <path d="M1000 210l6 12 13 2-9 9 2 13-12-7-11 7 2-13-9-9 13-2z" opacity="0.8"/>
  </g>

  <!-- Globo -->
  <g>
    <line x1="1185" y1="330" x2="1185" y2="470" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    <ellipse cx="1185" cy="300" rx="52" ry="60" fill="#FF82AE"/>
    <path d="M1178 356l14 0-7 16z" fill="#FF82AE"/>
    <ellipse cx="1168" cy="282" rx="14" ry="18" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Arcoíris de juguete (stacker) abajo izquierda -->
  <g fill="none" stroke-linecap="round">
    <path d="M150 560a165 165 0 0 1 330 0" stroke="#FF82AE" stroke-width="34"/>
    <path d="M191 560a124 124 0 0 1 248 0" stroke="#FFA600" stroke-width="32"/>
    <path d="M229 560a86 86 0 0 1 172 0" stroke="#3DC5FF" stroke-width="30"/>
    <path d="M266 560a49 49 0 0 1 98 0" stroke="#A4C21F" stroke-width="28"/>
  </g>

  <!-- Bloques de construcción -->
  <g>
    <rect x="560" y="486" width="86" height="86" rx="16" fill="#3DC5FF" transform="rotate(-6 603 529)"/>
    <rect x="556" y="486" width="86" height="86" rx="16" fill="#FF82AE" transform="translate(70 0) rotate(5 599 529)"/>
    <rect x="590" y="560" width="90" height="60" rx="14" fill="#A4C21F"/>
  </g>

  <!-- Planta en maceta abajo derecha -->
  <g>
    <path d="M1300 640q-34-70 6-118 26 34 6 84z" fill="#A4C21F"/>
    <path d="M1330 646q40-60 96-52-18 44-72 60z" fill="#8FB017"/>
    <path d="M1300 660q-46-30-96-14 26 40 84 34z" fill="#A4C21F"/>
    <path d="M1288 636h84l-12 74a10 10 0 0 1-10 9h-40a10 10 0 0 1-10-9z" fill="url(#pot)"/>
  </g>

  <!-- Cápsulas flotantes (motivo de la paleta) -->
  <g opacity="0.9">
    <rect x="700" y="470" width="26" height="46" rx="13" fill="#ffffff" opacity="0.25"/>
    <rect x="1050" y="430" width="22" height="40" rx="11" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- Scrim central para legibilidad del texto -->
  <rect width="1600" height="760" fill="url(#scrim)"/>
</svg>
